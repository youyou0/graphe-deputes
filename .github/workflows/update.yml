# Met à jour les données (Assemblée nationale, HATVP, SIREN, vidéos) et republie
# le site sur GitHub Pages. Les données générées ne sont jamais commitées :
# elles sont reconstruites à chaque exécution et publiées directement.
name: Mise à jour des données

on:
  schedule:
    - cron: "17 4 * * *" # tous les jours vers 5 h (heure de Paris en hiver)
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/sujets/requirements.txt

      # Caches des appels externes (SIREN, liens vidéo, photos, embeddings des
      # sujets) : on ne redemande que ce qui est nouveau. La clé change à chaque
      # exécution pour sauvegarder le cache enrichi ; restore-keys reprend le plus récent.
      - name: Restaurer les caches
        uses: actions/cache@v4
        with:
          path: |
            raw/siren_cache.json
            raw/videos_cache.json
            raw/photos
            raw/sujets_emb.npz
          key: caches-${{ github.run_id }}
          restore-keys: caches-

      - name: Construire les données
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python -I scripts/build_data.py

      # Carte des sujets. Le modèle d'embeddings tourne sur CPU : seuls les passages
      # nouveaux sont encodés (quelques minutes par jour). Si le cache a disparu, il est
      # repris de la release « sujets-cache » (calcul initial fait une fois sur GPU).
      # En cas d'échec, le reste du site est publié quand même.
      - name: Modèle d'embeddings (cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1

      - name: Carte des sujets
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f raw/sujets_emb.npz ]; then
            gh release download sujets-cache --pattern sujets_emb.npz --dir raw || echo "Pas de cache initial : calcul complet"
          fi
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r scripts/sujets/requirements.txt
          python -I scripts/sujets/run.py

      - name: Vérifier le résultat
        run: |
          python -I - <<'EOF'
          import json, pathlib
          d = json.loads(pathlib.Path("site/data.json").read_text(encoding="utf-8"))
          n = len(d["deputes"])
          assert n > 500, f"seulement {n} députés : données incomplètes, publication annulée"
          import os
          print("sujets :", "ok" if os.path.exists("site/sujets.json.gz") else "absents (section indisponible)")
          print(f"{n} députés, {d['scrutins']['total']} scrutins, dernier le {d['scrutins']['dernier']}")
          EOF

      # Version des fichiers : un navigateur ne garde jamais un ancien app.js avec un nouvel index.html.
      - name: Numéroter les fichiers
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}/g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
